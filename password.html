<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="referrer" content="no-referrer"><title>Change Password | Transfers</title>
 <script>try{document.documentElement.dataset.theme=localStorage.getItem("transfers-theme")==="dark"?"dark":"light"}catch(e){}</script>
 <link rel="stylesheet" href="styles.css?v=20261009-permissions">
 <style>
 body.password-page{min-height:100dvh;display:flex;align-items:center;justify-content:center;margin:0;padding:24px}
 .password-card{width:min(100%,420px);padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
 .password-card h1{margin:0 0 12px;font-size:24px}.password-card p{overflow-wrap:anywhere}
 .password-card form{display:grid;gap:16px}.password-card label{display:grid;gap:6px}
 .password-card input{width:100%}.password-card button{width:100%}
 .password-card a{color:var(--accent)}#passwordMessage{min-height:20px;font-size:13px}#passwordAccount{color:var(--muted);font-size:13px}
 #passwordForm[hidden]{display:none}
 </style>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
</head>
<body class="password-page">
 <section class="password-card" aria-labelledby="passwordTitle">
  <h1 id="passwordTitle">Set New Password</h1>
  <p id="passwordAccount">Checking your account…</p>
  <form id="passwordForm" hidden>
   <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
   <label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
   <small>Use at least 8 characters.</small>
   <button id="savePassword" type="submit" class="primary">Save Password</button>
  </form>
  <p id="passwordMessage" role="status" aria-live="polite"></p>
  <a href="index.html">Back to Transfers</a>
 </section>
 <script src="password.js?v=20261009-password"></script>
</body></html>
